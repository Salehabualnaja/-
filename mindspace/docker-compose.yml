services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindspace
      POSTGRES_PASSWORD: mindspace
      POSTGRES_DB: mindspace
    ports:
      - "5432:5432"
    volumes:
      - mindspace-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindspace"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mindspace-db:

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14110C" />
  <title>مؤقت المشاريع</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="المؤقت" />
  <style>
    /* ── الهوية: دفتر سجلّ دافئ + وجه ساعة إيقاف نحاسي ── */
    :root {
      color-scheme: light;
      --bg: #FBF8F2;
      --panel: #FFFFFF;
      --panel-2: #F5F0E6;
      --text: #1C1A15;
      --muted: #8A8172;
      --border: #EAE2D3;
      --border-strong: #DDD2BE;
      --accent: #B45309;          /* نحاسي/كهرماني محروق */
      --accent-ink: #8A3D06;
      --accent-soft: #F7E8D3;
      --run: #15803D;             /* أخضر تركيز للمؤقت العامل */
      --run-soft: #DBEFDF;
      --danger: #B4241C;
      --track: #ECE4D5;
      /* لوحة العدّاد (وجه الساعة) — ثابتة في الوضعين */
      --dial-bg-1: #241E15;
      --dial-bg-2: #16110B;
      --dial-line: rgba(240, 198, 116, .30);
      --dial-amber: #F0C674;
      --dial-gold: #C9A24B;
      --dial-cream: #E9DEC9;
      --dial-green: #7BD69A;
      --shadow: 0 1px 2px rgba(28, 26, 21, .06), 0 10px 30px rgba(28, 26, 21, .07);
      --shadow-dial: 0 12px 34px rgba(20, 15, 8, .35), inset 0 1px 0 rgba(255,255,255,.05);
      --radius: 14px;
      --f-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Kufi Arabic", "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #14110C;
        --panel: #1E1A13;
        --panel-2: #191510;
        --text: #F0EADD;
        --muted: #A69C88;
        --border: #2D2820;
        --border-strong: #3A3428;
        --accent: #E0912F;
        --accent-ink: #F0B060;
        --accent-soft: #38290F;
        --run: #4CBE72;
        --run-soft: #16301F;
        --danger: #E8776F;
        --track: #2A251C;
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.4);
      }
    }
    /* تجاوز صريح لزر تبديل الثيم */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #FBF8F2; --panel: #FFFFFF; --panel-2: #F5F0E6; --text: #1C1A15;
      --muted: #8A8172; --border: #EAE2D3; --border-strong: #DDD2BE;
      --accent: #B45309; --accent-ink: #8A3D06; --accent-soft: #F7E8D3;
      --run: #15803D; --run-soft: #DBEFDF; --danger: #B4241C; --track: #ECE4D5;
      --shadow: 0 1px 2px rgba(28,26,21,.06), 0 10px 30px rgba(28,26,21,.07);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #14110C; --panel: #1E1A13; --panel-2: #191510; --text: #F0EADD;
      --muted: #A69C88; --border: #2D2820; --border-strong: #3A3428;
      --accent: #E0912F; --accent-ink: #F0B060; --accent-soft: #38290F;
      --run: #4CBE72; --run-soft: #16301F; --danger: #E8776F; --track: #2A251C;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.4);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--f-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .wrap { max-width: 620px; margin: 0 auto; padding: 20px 16px 100px; }

    /* الرأس */
    header.app { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 2px; }
    header.app h1 { font-size: 17px; margin: 0; font-weight: 800; letter-spacing: .2px; }
    header.app .date { color: var(--muted); font-size: 12.5px; }

    /* لوحة العدّاد — وجه ساعة الإيقاف */
    .summary {
      background: linear-gradient(158deg, var(--dial-bg-1), var(--dial-bg-2));
      color: var(--dial-cream);
      border-radius: 20px;
      padding: 24px 22px 20px;
      margin: 16px 0 18px;
      box-shadow: var(--shadow-dial);
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(240,198,116,.14);
    }
    .summary::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--dial-amber), transparent);
      opacity: .5;
    }
    .summary .label {
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--dial-gold); font-weight: 700;
    }
    .summary .total {
      font-size: clamp(42px, 13vw, 56px); font-weight: 800; margin: 6px 0 2px;
      font-variant-numeric: tabular-nums; letter-spacing: 2px; color: var(--dial-amber);
      text-shadow: 0 0 24px rgba(240,198,116,.22); line-height: 1;
    }
    .summary .sub { font-size: 13px; color: var(--dial-cream); opacity: .82; font-variant-numeric: tabular-nums; }
    .goalwrap { margin-top: 16px; }
    .goalbar { height: 8px; border-radius: 999px; background: rgba(233,222,201,.16); overflow: hidden; }
    .goalfill { height: 100%; background: var(--dial-amber); border-radius: 999px; width: 0; transition: width .45s ease; }
    .goalfill.done { background: var(--dial-green); }
    .goaltext { font-size: 12px; color: var(--dial-cream); opacity: .92; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
    .goaltext button {
      background: rgba(240,198,116,.14); color: var(--dial-amber); border: 1px solid rgba(240,198,116,.25);
      border-radius: 8px; padding: 4px 10px; font-size: 11.5px; font-family: inherit; cursor: pointer; font-weight: 700; flex: none;
    }
    .goaltext button:hover { background: rgba(240,198,116,.22); }

    /* التبويب العلوي بين الخطة والمؤقتات */
    .topnav { display: flex; gap: 8px; margin: 14px 0 16px; }
    .topnav button { flex: 1; border: 1px solid var(--border); background: var(--panel); color: var(--muted); font-family: inherit; font-size: 14.5px; font-weight: 800; padding: 12px 0; border-radius: 13px; cursor: pointer; box-shadow: var(--shadow); transition: color .15s, border-color .15s, background .15s; }
    .topnav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* التبويبات الفرعية */
    .tabs { display: flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 18px; gap: 4px; }
    .tabs button { flex: 1; border: none; background: transparent; color: var(--muted); font-family: inherit; font-size: 13.5px; font-weight: 700; padding: 9px 0; border-radius: 9px; cursor: pointer; transition: color .15s, background .15s; }
    .tabs button.active { background: var(--panel); color: var(--accent); box-shadow: var(--shadow); }

    .section-title { font-size: 11px; color: var(--muted); margin: 6px 4px 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }

    /* ── قسم الخطة ── */
    .planbar-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
    .pb-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .pb-title { font-weight: 800; font-size: 15.5px; }
    .pb-pct { font-weight: 800; font-size: 20px; color: var(--accent); font-variant-numeric: tabular-nums; }
    .pb-track { height: 14px; border-radius: 999px; background: var(--track); overflow: hidden; }
    .pb-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent-ink), var(--accent)); transition: width .5s ease; }
    .pb-fill.alt { background: linear-gradient(90deg, #B45309, #E0A94A); }
    .pb-sub { font-size: 12px; color: var(--muted); margin-top: 7px; font-variant-numeric: tabular-nums; }

    .domains-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 560px) { .domains-grid { grid-template-columns: repeat(4, 1fr); } }
    .domain-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 14px 8px 12px; cursor: pointer; font-family: inherit;
      display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .06s, border-color .15s;
    }
    .domain-card:hover { border-color: var(--border-strong); }
    .domain-card:active { transform: scale(.97); }
    .dc-ring { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center;
      background: conic-gradient(var(--accent) calc(var(--p, 0) * 1%), var(--track) 0); }
    .dc-ring .hole { width: 50px; height: 50px; border-radius: 50%; background: var(--panel); display: grid; place-items: center;
      font-weight: 800; font-size: 14px; color: var(--accent); font-variant-numeric: tabular-nums; }
    .dc-ring.zero .hole { color: var(--muted); }
    .dc-name { font-weight: 700; font-size: 12.5px; text-align: center; line-height: 1.25; }
    .dc-icon { font-size: 15px; }
    .dc-count { font-size: 10.5px; color: var(--muted); }

    /* أهداف المجال */
    .domain-progress { margin-bottom: 16px; }
    .goalrow { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .goalrow:last-child { border-bottom: none; }
    .goalrow .gcheck { width: 24px; height: 24px; flex: none; border-radius: 7px; border: 2px solid var(--border-strong); background: var(--panel-2); cursor: pointer; display: grid; place-items: center; font-size: 15px; color: #fff; }
    .goalrow .gcheck.done { background: var(--run); border-color: var(--run); }
    .goalrow .gtitle { flex: 1; min-width: 0; }
    .goalrow.done .gtitle { text-decoration: line-through; color: var(--muted); }
    .goalrow .gyear { flex: none; font-size: 11px; font-weight: 700; border-radius: 7px; padding: 3px 9px; cursor: pointer; background: var(--accent-soft); color: var(--accent-ink); border: 1px solid var(--border); }

    /* صفوف المشاريع — أسطر دفتر السجلّ */
    .project {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      transition: border-color .2s;
    }
    /* شريط الحالة الجانبي عند التشغيل */
    .project.running { border-color: color-mix(in srgb, var(--run) 45%, var(--border)); }
    .project.running::before {
      content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px; background: var(--run);
    }
    .project .info { flex: 1; min-width: 0; padding-inline-start: 4px; }
    .project .name { font-weight: 700; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project .time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .project.running .time { color: var(--run); font-weight: 600; }

    .btn {
      border: none; cursor: pointer; font-family: inherit;
      border-radius: 11px; font-weight: 700; font-size: 14.5px;
      padding: 10px 0; width: 74px; text-align: center; flex: none;
      transition: transform .06s, background .2s, filter .2s;
    }
    .btn:active { transform: scale(.95); }
    .btn.start { background: var(--accent-soft); color: var(--accent-ink); }
    .btn.start:hover { filter: brightness(.97); }
    .btn.stop { background: var(--run); color: #fff; }
    .btn.stop:hover { filter: brightness(1.05); }

    .iconbtn {
      background: transparent; border: none; cursor: pointer; color: var(--muted);
      font-size: 16px; padding: 6px; border-radius: 9px; flex: none; line-height: 1; transition: background .15s;
    }
    .iconbtn:hover { background: var(--panel-2); }
    .iconbtn:active { background: var(--border); }

    .empty { text-align: center; color: var(--muted); padding: 34px 14px; font-size: 14px; border: 1px dashed var(--border-strong); border-radius: var(--radius); }

    /* التقارير */
    .report-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .report-card h4 { margin: 0 0 14px; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .rrow { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 13px; }
    .rrow:last-child { margin-bottom: 0; }
    .rrow .rlabel { width: 92px; flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
    .rrow .rtrack { flex: 1; height: 18px; background: var(--track); border-radius: 5px; overflow: hidden; position: relative; }
    .rrow .rfill { display: block; height: 100%; background: var(--accent); border-radius: 5px; width: 0; min-width: 2px; transition: width .35s; }
    .rrow .rfill.met { background: var(--run); }
    .rrow .rgoal { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--danger); opacity: .6; }
    .rrow .rval { width: 60px; flex: none; text-align: left; font-variant-numeric: tabular-nums; font-weight: 700; }
    .report-total { text-align: center; }
    .report-total > span:first-child { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .report-total b { color: var(--accent); font-size: 30px; display: block; font-variant-numeric: tabular-nums; margin: 4px 0 2px; letter-spacing: 1px; }
    .report-total > span:last-child { font-size: 12.5px; color: var(--muted); }

    .footer-tools { text-align: center; margin-top: 10px; }
    .linkbtn { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-family: inherit; }
    .linkbtn:hover { color: var(--accent); }
    .install-wrap { text-align: center; margin-top: 14px; }
    .install-wrap[hidden] { display: none; }
    #installBtn { background: var(--accent-soft); color: var(--accent-ink); border: 1px solid var(--border-strong); border-radius: 11px; padding: 10px 18px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; }
    #installBtn:hover { filter: brightness(.98); }

    /* شريط الإضافة */
    .addbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: color-mix(in srgb, var(--panel) 90%, transparent);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }
    .addbar .row { max-width: 620px; margin: 0 auto; display: flex; gap: 10px; }
    .addbar input {
      flex: 1; border: 1px solid var(--border-strong); background: var(--panel); color: var(--text);
      border-radius: 11px; padding: 12px 14px; font-size: 15px; font-family: inherit; min-width: 0;
    }
    .addbar input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .addbar button {
      background: var(--accent); color: #fff; border: none; border-radius: 11px;
      padding: 0 20px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; flex: none;
    }
    .addbar button:hover { background: var(--accent-ink); }
    .addbar.hidden { display: none; }

    /* النوافذ الحوارية */
    dialog {
      border: none; border-radius: 16px; padding: 0; max-width: 92vw; width: 400px;
      background: var(--panel); color: var(--text); box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(20, 15, 8, .5); backdrop-filter: blur(2px); }
    .dlg { padding: 20px; }
    .dlg h3 { margin: 0 0 6px; font-size: 17px; font-weight: 800; }
    .dlg p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
    .dlg .rows { display: flex; flex-direction: column; gap: 10px; }
    .dlg label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px; font-weight: 600; }
    .dlg input, .dlg select { width: 100%; border: 1px solid var(--border-strong); background: var(--panel-2); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: inherit; }
    .dlg input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .dlg .inline { display: flex; gap: 10px; }
    .dlg .inline > div { flex: 1; }
    .dlg .actions { display: flex; gap: 10px; margin-top: 18px; }
    .dlg .actions button { flex: 1; border: none; border-radius: 10px; padding: 11px 0; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .dlg .ok { background: var(--accent); color: #fff; }
    .dlg .ok:hover { background: var(--accent-ink); }
    .dlg .ok.danger { background: var(--danger); }
    .dlg .cancel { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }

    .seg { display: flex; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; }
    .seg button { flex: 1; border: none; background: var(--panel-2); color: var(--muted); font-family: inherit; font-weight: 700; padding: 9px 0; cursor: pointer; font-size: 14px; transition: background .15s, color .15s; }
    .seg button.active { background: var(--accent); color: #fff; }

    .loghdr { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 8px; }
    .loghdr h4 { margin: 0; font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; }
    .logbox { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
    .logitem { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .logitem:last-child { border-bottom: none; }
    .logitem .lmain { flex: 1; min-width: 0; }
    .logitem .lday { font-weight: 700; display: flex; align-items: center; }
    .logitem .lsub { color: var(--muted); font-size: 12px; margin-top: 1px; font-variant-numeric: tabular-nums; }
    .logitem .ldur { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--accent); }
    .logitem .ldur.neg { color: var(--danger); }
    .logempty { padding: 20px; text-align: center; color: var(--muted); font-size: 13px; }
    .tag { font-size: 10.5px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 6px; padding: 1px 7px; margin-inline-start: 6px; font-weight: 700; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app">
      <h1 id="appTitle">🎯 خطتي</h1>
      <div class="date" id="dayLabel"></div>
    </header>

    <div class="topnav">
      <button data-mode="plan" class="active">🎯 الخطة</button>
      <button data-mode="timer">⏱️ المؤقتات</button>
    </div>

    <!-- ═══ قسم الخطة (الصفحة الرئيسية) ═══ -->
    <section id="planSection">
      <div class="planbar-card">
        <div class="pb-head"><span class="pb-title">🌟 خطة 2030</span><span class="pb-pct" id="pct2030">٠٪</span></div>
        <div class="pb-track"><div class="pb-fill" id="fill2030"></div></div>
        <div class="pb-sub" id="sub2030">٠ من ٠ هدف مُنجَز</div>
      </div>
      <div class="planbar-card">
        <div class="pb-head"><span class="pb-title">📅 خطة 2026</span><span class="pb-pct" id="pct2026">٠٪</span></div>
        <div class="pb-track"><div class="pb-fill alt" id="fill2026"></div></div>
        <div class="pb-sub" id="sub2026">٠ من ٠ هدف مُنجَز</div>
      </div>

      <div class="section-title">المجالات الثمانية</div>
      <div class="domains-grid" id="domainsGrid"></div>
    </section>

    <!-- ═══ قسم المؤقتات ═══ -->
    <section id="timerSection" hidden>
      <div class="summary">
        <div class="label" id="summaryLabel">مجموع ساعات العمل اليوم</div>
        <div class="total" id="totalClock">00:00:00</div>
        <div class="sub" id="totalHours">0.00 ساعة</div>
        <div class="goalwrap" id="goalWrap">
          <div class="goalbar"><div class="goalfill" id="goalFill"></div></div>
          <div class="goaltext">
            <span id="goalText">الهدف اليومي</span>
            <button id="editGoalBtn">🎯 تعديل الهدف</button>
          </div>
        </div>
      </div>

      <div class="tabs">
        <button data-view="today" class="active">اليوم</button>
        <button data-view="week">آخر ٧ أيام</button>
        <button data-view="month">آخر ٣٠ يوماً</button>
      </div>

      <div id="content"></div>
    </section>

    <div class="footer-tools">

      &nbsp;·&nbsp;

  <div class="addbar" id="addbar">
    <div class="row">
      <input id="newName" type="text" placeholder="اسم مشروع جديد…" autocomplete="off" />
      <button id="addBtn">إضافة</button>
    </div>

  <!-- تعديل اسم المشروع -->
  <dialog id="editDlg">
    <form method="dialog" class="dlg">
      <h3>تعديل اسم المشروع</h3>
      <div class="rows"><input id="editName" type="text" placeholder="اسم المشروع" /></div>
      <div class="actions">
        <button class="ok" value="save">حفظ</button>
        <button class="cancel" value="cancel" formnovalidate>إلغاء</button>
      </div>

  </dialog>

  <!-- الهدف اليومي -->
  <dialog id="goalDlg">
    <form method="dialog" class="dlg">
      <h3>الهدف اليومي</h3>
      <p>كم ساعة تريد إنجازها كل يوم؟</p>

        <input id="goalInput" type="number" min="0" max="24" step="0.5" placeholder="مثال: 8" />

      <div class="actions">
        <button class="ok" value="save">حفظ</button>
        <button class="cancel" value="cancel" formnovalidate>إلغاء</button>

  <!-- تأكيد الحذف -->

    <div class="dlg">

        <button class="cancel" id="confirmNo">إلغاء</button>

  <!-- تعديل الوقت اليدوي + سجل الجلسات -->
  <dialog id="timeDlg">
    <div class="dlg">
      <h3 id="timeTitle">تعديل الوقت</h3>
      <label>إضافة أو طرح وقت</label>
      <div class="seg" style="margin-bottom:10px">
        <button type="button" id="segAdd" class="active">إضافة (+)</button>
        <button type="button" id="segSub">طرح (−)</button>
      </div>
      <div class="inline">
        <div>
          <label>التاريخ</label>
          <input id="manualDate" type="date" />
        </div>
        <div>
          <label>ساعات</label>
          <input id="manualH" type="number" min="0" max="23" step="1" placeholder="0" />
        </div>
        <div>
          <label>دقائق</label>
          <input id="manualM" type="number" min="0" max="59" step="1" placeholder="0" />
        </div>
      </div>
      <div class="actions" style="margin-top:12px">
        <button class="ok" id="manualApply">تطبيق</button>
        <button class="cancel" id="timeClose">إغلاق</button>

      <div class="loghdr"><h4>سجل الجلسات</h4></div>

  <!-- أهداف المجال -->
  <dialog id="domainDlg">
    <div class="dlg">
      <h3 id="domainTitle">المجال</h3>
      <div class="domain-progress">
        <div class="pb-track"><div class="pb-fill" id="domainFill"></div></div>
        <div class="pb-sub" id="domainSub">٠ من ٠ هدف مُنجَز</div>
      </div>

      <label>إضافة هدف</label>
      <div class="rows">
        <input id="goalTitleInput" type="text" placeholder="اكتب الهدف…" autocomplete="off" />
        <div class="inline" style="align-items:flex-end">
          <div>
            <label>السنة المستهدفة</label>
            <div class="seg">
              <button type="button" id="goalYear2026" class="active">2026</button>
              <button type="button" id="goalYear2030">2030</button>
            </div>
          </div>
          <button class="ok" id="goalAddBtn" style="flex:none;padding:10px 18px;border:none;border-radius:10px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer;font-family:inherit">إضافة</button>
        </div>
      </div>

      <div class="loghdr"><h4>الأهداف</h4></div>
      <div class="logbox" id="goalsBox"></div>

      <div class="actions" style="margin-top:14px">
        <button class="cancel" id="domainClose">إغلاق</button>
      </div>
    </div>
  </dialog>

  <script>
  (function () {
    "use strict";

    const STORAGE_KEY = "project-time-tracker.v2";
    const OLD_KEY = "project-time-tracker.v1";
    const DAY_START_HOUR = 5;             // يبدأ اليوم الساعة 5 صباحاً
    const DAY_MS = 24 * 60 * 60 * 1000;   // وينتهي بعد 24 ساعة

    // ---------- الحالة ----------
    // state.projects[]: { id, name, sessions: [] }
    //   جلسة مؤقت: { start, end|null }
    //   إدخال يدوي: { manual:true, day:<بداية يوم العمل ms>, ms:<موجب/سالب>, created }
    // state.settings: { dailyGoalHours }
    // state.goals[]: { id, domainId, year: 2026|2030, title, done, created }
    const DOMAINS = [
      { id: "worship", name: "العبادة", icon: "🕌" },
      { id: "morals",  name: "الأخلاق", icon: "🌸" },
      { id: "knowledge", name: "المعرفة", icon: "📚" },
      { id: "career",  name: "المهنة", icon: "💼" },
      { id: "money",   name: "المال", icon: "💰" },
      { id: "health",  name: "الصحة", icon: "💪" },
      { id: "family",  name: "المجتمع والعائلة", icon: "👨‍👩‍👧‍👦" },
      { id: "skill",   name: "المهارة", icon: "🛠️" }
    ];
    let state = load();
    let currentView = "today";
    let appMode = "plan"; // plan | timer

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) { const p = JSON.parse(raw); if (p && Array.isArray(p.projects)) return withDefaults(p); }
        const old = localStorage.getItem(OLD_KEY);
        if (old) { const p = JSON.parse(old); if (p && Array.isArray(p.projects)) return withDefaults(p); }
      } catch (e) {}
      return withDefaults({ projects: [] });
    }
    function withDefaults(p) {
      if (!p.settings) p.settings = {};
      if (typeof p.settings.dailyGoalHours !== "number") p.settings.dailyGoalHours = 8;
      if (!Array.isArray(p.goals)) p.goals = [];
      return p;
    }
    function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

    // ---------- حدود يوم العمل (يبدأ 5 صباحاً) ----------
    function dayStartOf(dateLike) {
      const d = new Date(dateLike);
      const start = new Date(d);
      start.setHours(DAY_START_HOUR, 0, 0, 0);
      if (d.getTime() < start.getTime()) start.setDate(start.getDate() - 1);
      return start.getTime();
    }
    // بداية يوم العمل قبل n أيام من يوم اليوم
    function dayStartAgo(n) {
      const base = new Date(dayStartOf(Date.now()));
      base.setDate(base.getDate() - n);
      return base.getTime();
    }

    // مساهمة جلسة في نافذة يوم عمل [winStart, winStart+DAY_MS]
    function sessionMsInDay(session, winStart, nowMs) {
      if (session.manual) return session.day === winStart ? session.ms : 0;
      const s = Math.max(session.start, winStart);
      const end = session.end == null ? nowMs : session.end;
      const e = Math.min(end, winStart + DAY_MS, nowMs);
      return Math.max(0, e - s);
    }
    function projectMsInDay(project, winStart, nowMs) {
      let ms = 0;
      for (const ses of project.sessions) ms += sessionMsInDay(ses, winStart, nowMs);
      return ms; // قد يكون سالباً بسبب الطرح اليدوي؛ التصفير عند العرض
    }
    function isRunning(project) { return project.sessions.some(s => !s.manual && s.end == null); }

    // ---------- منطق المؤقتات ----------
    function startProject(id) {
      const now = Date.now();
      for (const p of state.projects) {
        if (p.id === id) { if (!isRunning(p)) p.sessions.push({ start: now, end: null }); }
        else stopSessions(p, now);
      }
      save(); render();
    }
    function stopProject(id) {
      const now = Date.now();
      const p = state.projects.find(x => x.id === id);
      if (p) { stopSessions(p, now); save(); render(); }
    }
    function stopSessions(project, now) {
      for (const s of project.sessions) if (!s.manual && s.end == null) s.end = now;
    }
    function addProject(name) {
      name = (name || "").trim(); if (!name) return;
      state.projects.push({ id: uid(), name, sessions: [] });
      save(); render();
    }
    function renameProject(id, name) {
      name = (name || "").trim(); if (!name) return;
      const p = state.projects.find(x => x.id === id);
      if (p) { p.name = name; save(); render(); }
    }
    function deleteProject(id) {
      state.projects = state.projects.filter(x => x.id !== id);
      save(); render();
    }

    // ---------- التنسيق ----------
    function pad(n) { return String(n).padStart(2, "0"); }
    function fmtClock(ms) {
      const neg = ms < 0; ms = Math.abs(ms);
      const t = Math.floor(ms / 1000);
      return (neg ? "−" : "") + pad(Math.floor(t / 3600)) + ":" + pad(Math.floor((t % 3600) / 60)) + ":" + pad(t % 60);
    }
    function fmtHM(ms) {
      const neg = ms < 0; ms = Math.abs(ms);
      const t = Math.floor(ms / 60000);
      const h = Math.floor(t / 60), m = t % 60;
      return (neg ? "−" : "") + (h > 0 ? h + " س " : "") + m + " د";
    }
    function fmtHours(ms) { return (ms / 3600000).toFixed(2) + " ساعة"; }

    const AR_DAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    const AR_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    function fmtDayLong(ms) { const d = new Date(ms); return AR_DAYS[d.getDay()] + "، " + d.getDate() + " " + AR_MONTHS[d.getMonth()] + " " + d.getFullYear(); }
    function fmtDayShort(ms) { const d = new Date(ms); return AR_DAYS[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth() + 1); }
    function toDateInput(ms) { const d = new Date(ms); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
    function dateInputToDayStart(val) { const d = new Date(val + "T00:00:00"); d.setHours(DAY_START_HOUR, 0, 0, 0); return d.getTime(); }

    // ---------- عناصر ----------
    const els = {
      content: document.getElementById("content"),
      clock: document.getElementById("totalClock"),
      totalHours: document.getElementById("totalHours"),
      dayLabel: document.getElementById("dayLabel"),
      summaryLabel: document.getElementById("summaryLabel"),
      newName: document.getElementById("newName"),
      addbar: document.getElementById("addbar"),
      goalWrap: document.getElementById("goalWrap"),
      goalFill: document.getElementById("goalFill"),
      goalText: document.getElementById("goalText"),
      appTitle: document.getElementById("appTitle"),
      planSection: document.getElementById("planSection"),
      timerSection: document.getElementById("timerSection"),
      domainsGrid: document.getElementById("domainsGrid"),
      pct2030: document.getElementById("pct2030"),
      fill2030: document.getElementById("fill2030"),
      sub2030: document.getElementById("sub2030"),
      pct2026: document.getElementById("pct2026"),
      fill2026: document.getElementById("fill2026"),
      sub2026: document.getElementById("sub2026"),
    };

    // ---------- الرأس والملخص ----------
    function goalMs() { return state.settings.dailyGoalHours * 3600000; }

    function renderSummary(totalMs, labelText) {
      els.summaryLabel.textContent = labelText;
      els.clock.textContent = fmtClock(Math.max(0, totalMs));
      els.totalHours.textContent = fmtHours(Math.max(0, totalMs));
      const g = goalMs();
      if (g > 0) {
        els.goalWrap.style.display = "";
        const pct = Math.min(100, Math.round((totalMs / g) * 100));
        els.goalFill.style.width = Math.max(0, pct) + "%";
        const done = totalMs >= g;
        els.goalFill.classList.toggle("done", done);
        els.goalText.textContent = (done ? "✅ " : "") + fmtHours(Math.max(0, totalMs)) + " / " + state.settings.dailyGoalHours + " ساعة (" + Math.max(0, pct) + "٪)";
      } else {
        els.goalWrap.style.display = "none";
      }
    }

    // ---------- التبديل بين الأوضاع ----------
    function render() {
      if (appMode === "plan") {
        els.appTitle.textContent = "🎯 خطتي";
        els.planSection.hidden = false;
        els.timerSection.hidden = true;
        els.addbar.classList.add("hidden");
        renderPlan();
      } else {
        els.appTitle.textContent = "⏱️ مؤقت المشاريع";
        els.planSection.hidden = true;
        els.timerSection.hidden = false;
        renderTimer();
      }
    }

    // ---------- عرض المؤقتات ----------
    function renderTimer() {
      const now = Date.now();
      const today = dayStartOf(now);
      els.dayLabel.textContent = fmtDayLong(today) + " · يبدأ اليوم ٥ صباحاً";

      if (currentView === "today") { els.addbar.classList.remove("hidden"); renderToday(now, today); }
      else { els.addbar.classList.add("hidden"); renderReport(now, currentView === "week" ? 7 : 30); }
    }

    // ---------- عرض الخطة ----------
    function toArDigits(s) { return String(s).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]); }

    function goalsInDomain(domainId) { return state.goals.filter(g => g.domainId === domainId); }
    function pctOf(list) { if (!list.length) return 0; return Math.round(list.filter(g => g.done).length / list.length * 100); }

    function renderPlan() {
      els.dayLabel.textContent = "لوحة الخطة الشخصية · ٨ مجالات";

      // البارات الكبيرة
      const all = state.goals;
      const y2026 = all.filter(g => g.year === 2026);
      setBar(els.fill2030, els.pct2030, els.sub2030, all);
      setBar(els.fill2026, els.pct2026, els.sub2026, y2026);

      // المربعات الثمانية
      const frag = document.createDocumentFragment();
      for (const d of DOMAINS) {
        const list = goalsInDomain(d.id);
        const pct = pctOf(list);
        const doneN = list.filter(g => g.done).length;

        const card = document.createElement("button");
        card.className = "domain-card";
        card.onclick = () => openDomain(d);

        const ring = document.createElement("div");
        ring.className = "dc-ring" + (pct === 0 ? " zero" : "");
        ring.style.setProperty("--p", pct);
        const hole = document.createElement("div");
        hole.className = "hole";
        hole.textContent = toArDigits(pct) + "٪";
        ring.append(hole);

        const name = document.createElement("div");
        name.className = "dc-name";
        name.innerHTML = '<span class="dc-icon">' + d.icon + '</span> ' + d.name;

        const count = document.createElement("div");
        count.className = "dc-count";
        count.textContent = list.length ? (toArDigits(doneN) + " من " + toArDigits(list.length)) : "لا أهداف";

        card.append(ring, name, count);
        frag.append(card);
      }
      els.domainsGrid.replaceChildren(frag);
    }

    function setBar(fillEl, pctEl, subEl, list) {
      const pct = pctOf(list);
      const doneN = list.filter(g => g.done).length;
      fillEl.style.width = pct + "%";
      pctEl.textContent = toArDigits(pct) + "٪";
      subEl.textContent = list.length
        ? (toArDigits(doneN) + " من " + toArDigits(list.length) + " هدف مُنجَز")
        : "لا توجد أهداف بعد";
    }

    function renderToday(now, today) {
      let totalMs = 0;
      const frag = document.createDocumentFragment();

      if (state.projects.length === 0) {
        const div = document.createElement("div");
        div.className = "empty";
        div.textContent = "لا توجد مشاريع بعد. أضف مشروعاً من الأسفل لتبدأ القياس.";
        frag.append(div);
      } else {
        const title = document.createElement("div");
        title.className = "section-title"; title.textContent = "المشاريع";
        frag.append(title);

        for (const p of state.projects) {
          const raw = projectMsInDay(p, today, now);
          const ms = Math.max(0, raw);
          totalMs += ms;
          const running = isRunning(p);

          const card = document.createElement("div");
          card.className = "project" + (running ? " running" : "");

          const info = document.createElement("div");
          info.className = "info";
          const name = document.createElement("div");
          name.className = "name"; name.textContent = p.name;
          const time = document.createElement("div");
          time.className = "time"; time.dataset.pid = p.id;
          time.textContent = clockLine(ms, running);
          info.append(name, time);

          const timeEdit = mkIcon("🕐", "تعديل الوقت", () => openTimeEditor(p));
          const edit = mkIcon("✏️", "تعديل الاسم", () => openEdit(p));
          const del = mkIcon("🗑️", "حذف", () => openDelete(p));

          const toggle = document.createElement("button");
          toggle.className = "btn " + (running ? "stop" : "start");
          toggle.textContent = running ? "إيقاف" : "بدء";
          toggle.onclick = () => running ? stopProject(p.id) : startProject(p.id);

          card.append(info, timeEdit, edit, del, toggle);
          frag.append(card);
        }
      }
      els.content.replaceChildren(frag);
      renderSummary(totalMs, "مجموع ساعات العمل اليوم");
    }

    function clockLine(ms, running) {
      return fmtClock(ms) + " · " + fmtHours(ms) + (running ? " · يعمل الآن" : "");
    }
    function mkIcon(txt, title, onclick) {
      const b = document.createElement("button");
      b.className = "iconbtn"; b.textContent = txt; b.title = title; b.onclick = onclick;
      return b;
    }

    // ---------- تقرير أسبوعي / شهري ----------
    function renderReport(now, days) {
      const frag = document.createDocumentFragment();

      // مجاميع الأيام + مجاميع المشاريع
      const dayStarts = [];
      for (let i = days - 1; i >= 0; i--) dayStarts.push(dayStartAgo(i));

      const dayTotals = dayStarts.map(ds => {
        let t = 0;
        for (const p of state.projects) t += Math.max(0, projectMsInDay(p, ds, now));
        return t;
      });
      const rangeTotal = dayTotals.reduce((a, b) => a + b, 0);

      const projTotals = state.projects.map(p => {
        let t = 0;
        for (const ds of dayStarts) t += Math.max(0, projectMsInDay(p, ds, now));
        return { name: p.name, ms: t };
      }).filter(x => x.ms > 0).sort((a, b) => b.ms - a.ms);

      const g = goalMs();
      const maxDay = Math.max(g, ...dayTotals, 1);
      const daysMet = g > 0 ? dayTotals.filter(t => t >= g).length : 0;
      const avg = rangeTotal / days;

      // بطاقة الإجمالي
      const tot = document.createElement("div");
      tot.className = "report-card report-total";
      tot.innerHTML = "<span>الإجمالي خلال " + (days === 7 ? "٧ أيام" : "٣٠ يوماً") + "</span>" +
        "<b>" + fmtHours(rangeTotal) + "</b>" +
        "<span>المعدل اليومي: " + fmtHours(avg) + (g > 0 ? " · أيام تحقّق الهدف: " + daysMet + " من " + days : "") + "</span>";
      frag.append(tot);

      // مخطط الأيام
      const dc = document.createElement("div");
      dc.className = "report-card";
      dc.innerHTML = "<h4>حسب اليوم</h4>";
      for (let i = dayStarts.length - 1; i >= 0; i--) {
        const t = dayTotals[i];
        const met = g > 0 && t >= g;
        const row = document.createElement("div");
        row.className = "rrow";
        const goalMarker = g > 0 ? '<span class="rgoal" style="inset-inline-start:' + Math.min(100, (g / maxDay) * 100) + '%"></span>' : "";
        row.innerHTML =
          '<span class="rlabel">' + fmtDayShort(dayStarts[i]) + '</span>' +
          '<span class="rtrack"><span class="rfill ' + (met ? "met" : "") + '" style="width:' + (t / maxDay * 100) + '%"></span>' + goalMarker + '</span>' +
          '<span class="rval">' + fmtHM(t) + '</span>';
        dc.append(row);
      }
      frag.append(dc);

      // حسب المشروع
      const pc = document.createElement("div");
      pc.className = "report-card";
      pc.innerHTML = "<h4>حسب المشروع</h4>";
      if (projTotals.length === 0) {
        const e = document.createElement("div"); e.className = "logempty"; e.textContent = "لا يوجد وقت مسجّل في هذه الفترة."; pc.append(e);
      } else {
        const maxP = Math.max(...projTotals.map(x => x.ms), 1);
        for (const it of projTotals) {
          const row = document.createElement("div");
          row.className = "rrow";
          row.innerHTML =
            '<span class="rlabel" style="width:110px;color:var(--text)">' + escapeHtml(it.name) + '</span>' +
            '<span class="rtrack"><span class="rfill" style="width:' + (it.ms / maxP * 100) + '%"></span></span>' +
            '<span class="rval">' + fmtHours(it.ms).replace(" ساعة", "س") + '</span>';
          pc.append(row);
        }
      }
      frag.append(pc);

      els.content.replaceChildren(frag);
      renderSummary(dayTotals[dayTotals.length - 1], "ساعات اليوم");
    }

    function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    // ---------- التحديث الحي ----------
    function tick() {
      if (appMode !== "timer" || currentView !== "today") return;
      const now = Date.now();
      const today = dayStartOf(now);
      let totalMs = 0;
      for (const p of state.projects) {
        const ms = Math.max(0, projectMsInDay(p, today, now));
        totalMs += ms;
        const el = els.content.querySelector('.time[data-pid="' + p.id + '"]');
        if (el) el.textContent = clockLine(ms, isRunning(p));
      }
      renderSummary(totalMs, "مجموع ساعات العمل اليوم");
      if (tick._lastDay !== today) { tick._lastDay = today; render(); }
    }

    // ---------- نافذة تعديل الاسم ----------
    const editDlg = document.getElementById("editDlg");
    const editName = document.getElementById("editName");
    let editingId = null;
    function openEdit(p) { editingId = p.id; editName.value = p.name; editDlg.showModal(); editName.focus(); editName.select(); }
    editDlg.addEventListener("close", () => { if (editDlg.returnValue === "save" && editingId) renameProject(editingId, editName.value); editingId = null; });

    // ---------- نافذة الهدف ----------
    const goalDlg = document.getElementById("goalDlg");
    const goalInput = document.getElementById("goalInput");
    document.getElementById("editGoalBtn").onclick = () => { goalInput.value = state.settings.dailyGoalHours; goalDlg.showModal(); goalInput.focus(); goalInput.select(); };
    goalDlg.addEventListener("close", () => {
      if (goalDlg.returnValue === "save") {
        let v = parseFloat(goalInput.value);
        if (!isFinite(v) || v < 0) v = 0; if (v > 24) v = 24;
        state.settings.dailyGoalHours = v; save(); render();
      }
    });

    // ---------- نافذة الحذف ----------
    const confirmDlg = document.getElementById("confirmDlg");
    const confirmMsg = document.getElementById("confirmMsg");
    const confirmYes = document.getElementById("confirmYes");
    const confirmNo = document.getElementById("confirmNo");
    function openDelete(p) {
      confirmMsg.textContent = 'سيتم حذف المشروع «' + p.name + '» وكل سجلاته. لا يمكن التراجع.';
      confirmDlg.showModal();
      const onYes = () => { deleteProject(p.id); cleanup(); confirmDlg.close(); };
      const onNo = () => { cleanup(); confirmDlg.close(); };
      function cleanup() { confirmYes.removeEventListener("click", onYes); confirmNo.removeEventListener("click", onNo); }
      confirmYes.addEventListener("click", onYes);
      confirmNo.addEventListener("click", onNo);
    }

    // ---------- نافذة تعديل الوقت اليدوي + السجل ----------
    const timeDlg = document.getElementById("timeDlg");
    const timeTitle = document.getElementById("timeTitle");
    const manualDate = document.getElementById("manualDate");
    const manualH = document.getElementById("manualH");
    const manualM = document.getElementById("manualM");
    const segAdd = document.getElementById("segAdd");
    const segSub = document.getElementById("segSub");
    const logBox = document.getElementById("logBox");
    let timeProjectId = null;
    let manualSign = 1;

    function setSign(s) {
      manualSign = s;
      segAdd.classList.toggle("active", s === 1);
      segSub.classList.toggle("active", s === -1);
    }
    segAdd.onclick = () => setSign(1);
    segSub.onclick = () => setSign(-1);

    function openTimeEditor(p) {
      timeProjectId = p.id;
      timeTitle.textContent = "⏱ " + p.name;
      manualDate.value = toDateInput(dayStartOf(Date.now()));
      manualH.value = ""; manualM.value = "";
      setSign(1);
      renderLog();
      timeDlg.showModal();
    }

    document.getElementById("manualApply").onclick = () => {
      const p = state.projects.find(x => x.id === timeProjectId); if (!p) return;
      const h = parseInt(manualH.value, 10) || 0;
      const m = parseInt(manualM.value, 10) || 0;
      const ms = (h * 3600 + m * 60) * 1000 * manualSign;
      if (ms === 0) return;
      const day = dateInputToDayStart(manualDate.value || toDateInput(dayStartOf(Date.now())));
      p.sessions.push({ manual: true, day, ms, created: Date.now() });
      save();
      manualH.value = ""; manualM.value = "";
      renderLog(); render();
    };
    document.getElementById("timeClose").onclick = () => timeDlg.close();

    function renderLog() {
      const p = state.projects.find(x => x.id === timeProjectId);
      logBox.replaceChildren();
      if (!p) return;
      const now = Date.now();
      // بناء عناصر السجل مع مفتاح الترتيب
      const items = p.sessions.map((s, idx) => {
        if (s.manual) return { idx, day: s.day, sort: s.created || s.day, node: manualNode(s) };
        const dayS = dayStartOf(s.start);
        return { idx, day: dayS, sort: s.start, node: timerNode(s, now) };
      }).sort((a, b) => b.sort - a.sort);

      if (items.length === 0) {
        const e = document.createElement("div"); e.className = "logempty"; e.textContent = "لا توجد جلسات بعد."; logBox.append(e); return;
      }
      for (const it of items) {
        const del = mkIcon("🗑️", "حذف", () => {
          p.sessions.splice(p.sessions.indexOf(referenceOf(p, it.idx, items)), 1);
          save(); renderLog(); render();
        });
        it.node.append(del);
        logBox.append(it.node);
      }
    }
    // نستخدم الفهرس الأصلي المخزّن على العنصر لضمان الحذف الصحيح بعد الفرز
    function referenceOf(p, idx) { return p.sessions[idx]; }

    function manualNode(s) {
      const row = document.createElement("div"); row.className = "logitem";
      const main = document.createElement("div"); main.className = "lmain";
      const day = document.createElement("div"); day.className = "lday";
      day.innerHTML = fmtDayShort(s.day) + '<span class="tag">يدوي</span>';
      const sub = document.createElement("div"); sub.className = "lsub"; sub.textContent = s.ms < 0 ? "طرح وقت" : "إضافة وقت";
      main.append(day, sub);
      const dur = document.createElement("div"); dur.className = "ldur" + (s.ms < 0 ? " neg" : "");
      dur.textContent = (s.ms < 0 ? "−" : "+") + fmtHM(Math.abs(s.ms));
      row.append(main, dur);
      return row;
    }
    function timerNode(s, now) {
      const row = document.createElement("div"); row.className = "logitem";
      const main = document.createElement("div"); main.className = "lmain";
      const day = document.createElement("div"); day.className = "lday"; day.textContent = fmtDayShort(dayStartOf(s.start));
      const running = s.end == null;
      const st = new Date(s.start), en = new Date(running ? now : s.end);
      const sub = document.createElement("div"); sub.className = "lsub";
      sub.textContent = pad(st.getHours()) + ":" + pad(st.getMinutes()) + " ← " + (running ? "الآن" : pad(en.getHours()) + ":" + pad(en.getMinutes()));
      main.append(day, sub);
      const dur = document.createElement("div"); dur.className = "ldur";
      dur.textContent = fmtHM((running ? now : s.end) - s.start);
      row.append(main, dur);
      return row;
    }

    // ---------- تصدير / استيراد ----------
    document.getElementById("exportBtn").onclick = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = "project-time-backup.json"; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    document.getElementById("importBtn").onclick = () => {
      const input = document.createElement("input"); input.type = "file"; input.accept = "application/json,.json";
      input.onchange = () => {
        const file = input.files && input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (parsed && Array.isArray(parsed.projects)) { state = withDefaults(parsed); save(); render(); }
            else alert("ملف غير صالح");
          } catch (e) { alert("تعذّر قراءة الملف"); }
        };
        reader.readAsText(file);
      };
      input.click();
    };

    // ---------- الإضافة ----------
    document.getElementById("addBtn").onclick = () => { addProject(els.newName.value); els.newName.value = ""; els.newName.focus(); };
    els.newName.addEventListener("keydown", e => { if (e.key === "Enter") { addProject(els.newName.value); els.newName.value = ""; } });

    // ---------- التبويبات الفرعية (المؤقتات) ----------
    document.querySelectorAll(".tabs button").forEach(btn => {
      btn.onclick = () => {
        currentView = btn.dataset.view;
        document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b === btn));
        render();
      };
    });

    // ---------- التبويب العلوي (الخطة/المؤقتات) ----------
    document.querySelectorAll(".topnav button").forEach(btn => {
      btn.onclick = () => {
        appMode = btn.dataset.mode;
        document.querySelectorAll(".topnav button").forEach(b => b.classList.toggle("active", b === btn));
        render();
      };
    });

    // ---------- نافذة أهداف المجال ----------
    const domainDlg = document.getElementById("domainDlg");
    const domainTitle = document.getElementById("domainTitle");
    const domainFill = document.getElementById("domainFill");
    const domainSub = document.getElementById("domainSub");
    const goalsBox = document.getElementById("goalsBox");
    const goalTitleInput = document.getElementById("goalTitleInput");
    const goalYear2026 = document.getElementById("goalYear2026");
    const goalYear2030 = document.getElementById("goalYear2030");
    const goalAddBtn = document.getElementById("goalAddBtn");
    const domainClose = document.getElementById("domainClose");
    let currentDomainId = null;
    let newGoalYear = 2026;

    function setGoalYear(y) {
      newGoalYear = y;
      goalYear2026.classList.toggle("active", y === 2026);
      goalYear2030.classList.toggle("active", y === 2030);
    }
    goalYear2026.onclick = () => setGoalYear(2026);
    goalYear2030.onclick = () => setGoalYear(2030);

    function openDomain(d) {
      currentDomainId = d.id;
      domainTitle.textContent = d.icon + " " + d.name;
      goalTitleInput.value = "";
      setGoalYear(2026);
      renderGoals();
      domainDlg.showModal();
    }

    function renderGoals() {
      const d = DOMAINS.find(x => x.id === currentDomainId);
      const list = goalsInDomain(currentDomainId);
      const pct = pctOf(list);
      const doneN = list.filter(g => g.done).length;
      domainFill.style.width = pct + "%";
      domainSub.textContent = list.length
        ? (toArDigits(doneN) + " من " + toArDigits(list.length) + " هدف مُنجَز · " + toArDigits(pct) + "٪")
        : "لا أهداف بعد — أضِف أول هدف في مجال «" + (d ? d.name : "") + "»";

      goalsBox.replaceChildren();
      if (!list.length) {
        const e = document.createElement("div"); e.className = "logempty"; e.textContent = "لا توجد أهداف."; goalsBox.append(e); return;
      }
      // المنجَز أخيراً، والأحدث أولاً ضمن كل مجموعة
      const sorted = list.slice().sort((a, b) => (a.done - b.done) || (b.created - a.created));
      for (const g of sorted) {
        const row = document.createElement("div");
        row.className = "goalrow" + (g.done ? " done" : "");

        const check = document.createElement("button");
        check.className = "gcheck" + (g.done ? " done" : "");
        check.textContent = g.done ? "✓" : "";
        check.title = "تبديل الإنجاز";
        check.onclick = () => { g.done = !g.done; save(); renderGoals(); };

        const title = document.createElement("div");
        title.className = "gtitle"; title.textContent = g.title;

        const year = document.createElement("button");
        year.className = "gyear"; year.textContent = toArDigits(g.year);
        year.title = "تبديل السنة المستهدفة";
        year.onclick = () => { g.year = g.year === 2026 ? 2030 : 2026; save(); renderGoals(); };

        const del = document.createElement("button");
        del.className = "iconbtn"; del.textContent = "🗑️"; del.title = "حذف";
        del.onclick = () => { state.goals = state.goals.filter(x => x.id !== g.id); save(); renderGoals(); };

        row.append(check, title, year, del);
        goalsBox.append(row);
      }
    }

    function addGoal() {
      const t = goalTitleInput.value.trim();
      if (!t) return;
      state.goals.push({ id: uid(), domainId: currentDomainId, year: newGoalYear, title: t, done: false, created: Date.now() });
      save();
      goalTitleInput.value = "";
      renderGoals();
    }
    goalAddBtn.onclick = addGoal;
    goalTitleInput.addEventListener("keydown", e => { if (e.key === "Enter") addGoal(); });

    // عند الإغلاق حدّث لوحة الخطة
    domainClose.onclick = () => domainDlg.close();
    domainDlg.addEventListener("close", () => { if (appMode === "plan") renderPlan(); });

    // ---------- الإقلاع ----------
    render();
    setInterval(tick, 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

    // ---------- PWA: تسجيل الـ Service Worker وزر التثبيت ----------
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
    const installWrap = document.getElementById("installWrap");
    const installBtn = document.getElementById("installBtn");
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installWrap.hidden = false;
    });
    installBtn.onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (e) {}
      deferredPrompt = null;
      installWrap.hidden = true;
    };
    window.addEventListener("appinstalled", () => { installWrap.hidden = true; });
  })();
  </script>
</body>
</html>
